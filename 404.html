<meta name="theme-color" content="#070D26" media="(prefers-color-scheme: dark)">

<style>
.nf{max-width:560px;margin:0 auto;padding:48px 20px 72px;text-align:center;display:grid;gap:16px;justify-items:center}
.nf svg{width:140px;height:140px;max-width:100%}
.nf h1{font-size:40px}
.nf p{font-size:18px;color:var(--muted);font-weight:600}
.nf .badges{margin-top:8px}
</style>

<body>
<header class="doc-top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Bil At! ana sayfa"><span>Bil<b>At</b></span></a>
    <div class="sky-pick">
      <button type="button" class="sky-btn" aria-expanded="false" aria-controls="gokyuzu" aria-label="Gökyüzü teması">
        <span class="sky-dot" aria-hidden="true"></span><span class="sky-name">Otomatik</span>
        <svg class="sky-chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="sky-menu" id="gokyuzu" role="group" aria-label="Gökyüzü teması" hidden>
        <p class="sky-title" aria-hidden="true">Gökyüzü</p>
        <button type="button" data-tema="saat"><span class="sw sw-auto" aria-hidden="true"></span><span class="sky-opt"><b>Otomatik</b><small>Saate göre · şu an <span class="sky-now">Gündüz</span></small></span></button>
        <hr>
        <button type="button" data-tema="b"><span class="sw sw-b" aria-hidden="true"></span><b>Gündüz</b></button>
        <button type="button" data-tema="a"><span class="sw sw-a" aria-hidden="true"></span><b>Gün batımı</b></button>
        <button type="button" data-tema="c"><span class="sw sw-c" aria-hidden="true"></span><b>Gece</b></button>
      </div>
    </div>
  </div>
</header>

<main id="icerik" class="nf">
  <svg viewBox="-30 -30 60 60" aria-hidden="true">
    <circle r="28" fill="var(--ring)"/>
    <circle r="22" fill="var(--o)"/>
    <circle r="15" fill="var(--g)"/>
    <circle r="8" fill="var(--r)"/>
    <circle r="3" fill="var(--ring)"/>
    <path d="M14 -26L26 -14" stroke="#8B5A2B" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <h1>Bu ok hedefi ıskaladı</h1>
  <p>Aradığın sayfa yok.</p>
  <div class="badges">
    <a class="back" href="/">Ana sayfaya dön</a>
    <a class="badge" href="https://play.google.com/store/apps/details?id=com.steadylinelabs.bilat&amp;referrer=utm_source%3Dbilat.app%26utm_medium%3Dsite%26utm_campaign%3D404" aria-label="Bil At! oyununu Google Play'den indir">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M6 3.5v17l14-8.5z" fill="#fff"/></svg>
      <span><small>Hemen indir</small><strong>Google Play</strong></span>
    </a>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <a class="logo" href="/" aria-label="Bil At! ana sayfa"><span>Bil<b>At</b></span></a>

  </div>
